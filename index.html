<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADT 学业勤奋任务</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #14141a; color: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .screen { position: fixed; inset: 0; }
  .hidden { display: none !important; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 40px; text-align: center; }
  h1 { font-size: 42px; }
  h2 { font-size: 30px; }
  .sub { color: #aaa; font-size: 16px; }
  .form label { display: block; margin: 14px; font-size: 20px; }
  .form input { margin-left: 8px; padding: 8px 12px; font-size: 20px; border-radius: 6px; border: 1px solid #555; background: #222; color: #fff; }
  .btn { padding: 12px 44px; font-size: 22px; border-radius: 8px; border: none; background: #2d6cdf; color: #fff; cursor: pointer; }
  .btn:hover { background: #3b7bf0; }
  .btn.danger { background: #e0682d; animation: btnPulse 1.1s ease-in-out infinite; }
  @keyframes btnPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,104,45,.65); } 50% { box-shadow: 0 0 0 18px rgba(224,104,45,0); } }
  #instr-body { max-width: 760px; font-size: 20px; line-height: 1.9; white-space: pre-wrap; }

  .topbar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 22px; background: #1d1d24; }
  .topbar.center-top { justify-content: center; }

  /* 分屏 */
  #main-split { display: flex; height: calc(100% - 54px); }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  #left-panel { background: #232330; }
  #right-panel { background: #181820; }
  .panel.active { box-shadow: inset 0 0 0 4px #ffd400; }
  .panel-title { position: absolute; top: 16px; color: #999; font-size: 18px; }
  .problem { font-size: 120px; font-weight: bold; }
  .typed { font-size: 80px; color: #66d9ff; min-height: 100px; }
  .hint { color: #888; margin-top: 10px; font-size: 16px; }

  .dist-top { padding: 14px; display: flex; justify-content: center; }
  .dist-select { font-size: 18px; padding: 8px 12px; border-radius: 6px; background: #2a2a3a; color: #fff; border: 1px solid #777; max-width: 92%; }
  #dist-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; }
  #tetris-canvas { background: #0b0b0e; height: 76vh; }
  #mines-canvas { background: #1a1a22; }
  #video-el { max-width: 100%; max-height: 76vh; }
  .paused-note { position: absolute; bottom: 16px; color: #ffcc00; font-size: 20px; }
  .placeholder { color: #999; font-size: 18px; }

  /* 块后评定 */
  .rating-q { font-size: 30px; margin: 6px 0 26px; }
  .rating-opts { display: flex; flex-direction: column; gap: 14px; }
  .rating-btn { padding: 14px 40px; font-size: 24px; border-radius: 8px; border: 1px solid #666; background: #22242e; color: #fff; cursor: pointer; min-width: 360px; }
  .rating-btn:hover { background: #2d6cdf; }

  /* 练习(全屏数学) */
  .math-center { height: calc(100% - 54px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .practice-label { color: #ffd400; font-size: 22px; }
</style>
</head>
<body>

<!-- 开始页 -->
<div id="screen-start" class="screen center">
  <h1>学业勤奋任务</h1>
  <p class="sub">Academic Diligence Task (Galla et al., 2014)</p>
  <div class="form">
    <label>被试编号 <input id="participant" type="text" value="" placeholder="如 001"></label>
    <label>场次 <input id="session" type="text" value="001"></label>
  </div>

</div>

<!-- 说明页 -->

</div>

<!-- 练习页 -->
<div id="screen-practice" class="screen hidden">
  <div class="topbar"><span class="practice-label">练习阶段(仅数学)</span><span id="practice-timer"></span></div>
  <div class="math-center">
    <div id="practice-problem" class="problem"></div>
    <div id="practice-typed" class="typed"></div>
    <div class="hint">输入答案后按回车</div>
  </div>
</div>

<!-- 任务页(分屏) -->
<div id="screen-task" class="screen hidden">
  <div class="topbar center-top"><span id="task-timer"></span></div>
  <div id="main-split">
    <div id="left-panel" class="panel">
      <div class="panel-title">数学练习</div>
      <div id="task-problem" class="problem"></div>
      <div id="task-typed" class="typed"></div>
      <div class="hint">输入答案后按回车 · 点击左侧继续</div>
    </div>
    <div id="right-panel" class="panel">
      <div class="dist-top">
        <select id="dist-select" class="dist-select"></select>
      </div>
      <div id="dist-area">
        <canvas id="tetris-canvas"></canvas>
        <canvas id="mines-canvas"></canvas>
        <video id="video-el" playsinline></video>
        <div id="video-placeholder" class="placeholder hidden">视频加载失败</div>
      </div>
      <div id="paused-note" class="paused-note hidden"></div>
    </div>
  </div>
</div>

<!-- 块后评定 -->
<div id="screen-rating" class="screen center hidden">
  <h2 id="rating-block-title"></h2>
  <div class="rating-q">上一阶段的数学任务让你感到多无聊?</div>
  <div class="rating-opts">
    <button type="button" class="rating-btn" data-v="1">1 = 完全不无聊</button>
    <button type="button" class="rating-btn" data-v="2">2 = 不无聊</button>
    <button type="button" class="rating-btn" data-v="3">3 = 有点无聊</button>
    <button type="button" class="rating-btn" data-v="4">4 = 非常无聊</button>
  </div>
</div>

<!-- 结束页 -->
<div id="screen-end" class="screen center hidden">
  <h2>实验结束,感谢参与!</h2>
  <div id="submit-status" style="color:#66d9ff;"></div>
  <button id="btn-download" class="btn">下载数据(CSV)</button>
</div>

<script>
// ============================================================
//  CONFIG —— 只改这里即可
// ============================================================
const CONFIG = {
  // 实验时长(测试用:10 秒练习 + 5 个 10 秒块;正式施测改回 60 / 4*60)
  practiceSeconds: 10,
  blockSeconds: 10,
  nBlocks: 5,

  // 数学题:false 表示结果非负(0~9);true 可出现负数(需按 - 号)
  allowNegative: false,

  // ---------- 数据提交 ----------
  // 换成你的腾讯云服务器公网 IP,保持 /submit 结尾(部署见 ADT_server/README.md):
  //   例如 http://123.45.67.89/submit
  // 留空则只下载 CSV,不提交。
  submitUrl: "http://62.234.133.125/submit",
  submitMethod: "POST",
  // "json" = 提交 JSON 给后端;  "form" = 表单编码提交(适配 Google Forms / Apps Script 等)
  submitFormat: "form",

  // ---------- 视频(相对 index.html 的路径,放在 main 文件夹里)----------
  // 有几个视频,右侧下拉菜单里就有几个选项(以文件名命名),带声音播放。
  videos: [
    "./喜羊羊与灰太狼.mp4",
    "./奶龙.mp4",
    "./小黄人.mp4",
    "./巴啦啦小魔仙.mp4",
    "./王者荣耀.mp4",
  ],
};

// ============================================================
//  工具
// ============================================================
const $ = (id) => document.getElementById(id);
const round3 = (n) => Math.round(n * 1000) / 1000;
const basename = (p) => p.split('/').pop();
function fmtLocal(d) {   // 本地时间 → "YYYY-MM-DD HH:mm"
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function generateProblem() {
  let a = Math.floor(Math.random() * 10);
  let b = Math.floor(Math.random() * 10);
  if (!CONFIG.allowNegative && b > a) { const t = a; a = b; b = t; }
  return { a, b, ans: a - b, problem: a + "-" + b, text: a + " - " + b + " = ?" };
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  $(id).classList.remove('hidden');
}

// ============================================================
//  俄罗斯方块
// ============================================================
const PIECES = {
  I: [[0,1],[1,1],[2,1],[3,1]],
  O: [[1,0],[2,0],[1,1],[2,1]],
  T: [[1,0],[0,1],[1,1],[2,1]],
  S: [[1,0],[2,0],[0,1],[1,1]],
  Z: [[0,0],[1,0],[1,1],[2,1]],
  J: [[0,0],[0,1],[1,1],[2,1]],
  L: [[2,0],[0,1],[1,1],[2,1]],
};
const TET_COLORS = { I:'#00d9f0', O:'#ffd400', T:'#a040e0', S:'#33cc55', Z:'#e02020', J:'#2040e0', L:'#ff8c00' };

class Tetris {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cols = 10; this.rows = 20; this.cell = 28;
    canvas.width = this.cols * this.cell;
    canvas.height = this.rows * this.cell;
    this.reset();
  }
  reset() {
    this.grid = Array.from({ length: this.rows }, () => new Array(this.cols).fill(null));
    this.fallAcc = 0; this.fallInterval = 0.5;
    this.gameOver = false; this.lines = 0;
    this.spawn();
  }
  spawn() {
    const kinds = Object.keys(PIECES);
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    this.cur = { kind, cells: PIECES[kind].map(c => c.slice()), x: 3, y: 0 };
    if (this.collides(this.cur.cells, this.cur.x, this.cur.y)) {
      this.gameOver = true; this.cur = null;
    }
  }
  collides(cells, x, y) {
    for (const [cx, cy] of cells) {
      const bx = x + cx, by = y + cy;
      if (bx < 0 || bx >= this.cols || by >= this.rows) return true;
      if (by >= 0 && this.grid[by][bx]) return true;
    }
    return false;
  }
  move(dx) {
    if (this.cur && !this.gameOver && !this.collides(this.cur.cells, this.cur.x + dx, this.cur.y)) this.cur.x += dx;
  }
  softDrop() {
    if (this.cur && !this.gameOver) {
      if (!this.collides(this.cur.cells, this.cur.x, this.cur.y + 1)) this.cur.y++;
      else this.lock();
    }
  }
  hardDrop() {
    if (this.cur && !this.gameOver) {
      while (!this.collides(this.cur.cells, this.cur.x, this.cur.y + 1)) this.cur.y++;
      this.lock();
    }
  }
  rotate() {
    if (!this.cur || this.gameOver) return;
    const cells = this.cur.cells.map(([x, y]) => [3 - y, x]);
    for (const dx of [0, -1, 1, -2, 2]) {
      if (!this.collides(cells, this.cur.x + dx, this.cur.y)) { this.cur.cells = cells; this.cur.x += dx; return; }
    }
  }
  lock() {
    if (!this.cur) return;
    for (const [cx, cy] of this.cur.cells) {
      const bx = this.cur.x + cx, by = this.cur.y + cy;
      if (by < 0) this.gameOver = true;
      else if (by < this.rows && bx >= 0 && bx < this.cols) this.grid[by][bx] = this.cur.kind;
    }
    this.clearLines();
    this.spawn();
  }
  clearLines() {
    const kept = this.grid.filter(row => row.some(c => c === null));
    const cleared = this.rows - kept.length;
    this.lines += cleared;
    while (kept.length < this.rows) kept.unshift(new Array(this.cols).fill(null));
    this.grid = kept;
  }
  update(dt) {
    if (!this.cur || this.gameOver) return;
    this.fallAcc += dt;
    while (this.fallAcc >= this.fallInterval) {
      this.fallAcc -= this.fallInterval;
      if (!this.collides(this.cur.cells, this.cur.x, this.cur.y + 1)) this.cur.y++;
      else { this.lock(); break; }
    }
  }
  draw() {
    const ctx = this.ctx, c = this.cell;
    ctx.fillStyle = '#0b0b0e';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    for (let r = 0; r < this.rows; r++) for (let col = 0; col < this.cols; col++) {
      const kind = this.grid[r][col];
      if (kind) { ctx.fillStyle = TET_COLORS[kind]; ctx.fillRect(col * c + 1, r * c + 1, c - 2, c - 2); }
    }
    if (this.cur && !this.gameOver) {
      ctx.fillStyle = TET_COLORS[this.cur.kind];
      for (const [cx, cy] of this.cur.cells) {
        const bx = this.cur.x + cx, by = this.cur.y + cy;
        if (by >= 0) ctx.fillRect(bx * c + 1, by * c + 1, c - 2, c - 2);
      }
    }
  }
}

// ============================================================
//  扫雷(9×9 / 10 雷)
// ============================================================
class Minesweeper {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cols = 9; this.rows = 9; this.mines = 10;
    this.cell = 34; this.topH = 34;
    canvas.width = this.cols * this.cell;
    canvas.height = this.topH + this.rows * this.cell;
    this.reset();
  }
  reset() {
    this.status = 'play';
    this.grid = Array.from({ length: this.rows }, () =>
      Array.from({ length: this.cols }, () => ({ mine: false, adj: 0, revealed: false, flagged: false }))
    );
    let n = 0;
    while (n < this.mines) {
      const r = Math.floor(Math.random() * this.rows), c = Math.floor(Math.random() * this.cols);
      if (!this.grid[r][c].mine) { this.grid[r][c].mine = true; n++; }
    }
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      if (this.grid[r][c].mine) continue;
      let a = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < this.rows && cc >= 0 && cc < this.cols && this.grid[rr][cc].mine) a++;
      }
      this.grid[r][c].adj = a;
    }
  }
  flagCount() {
    let n = 0;
    for (const row of this.grid) for (const d of row) if (d.flagged) n++;
    return n;
  }
  reveal(r, c) {
    const d = this.grid[r][c];
    if (!d || d.revealed || d.flagged || this.status !== 'play') return;
    if (d.mine) { d.revealed = true; this.status = 'lose'; for (const row of this.grid) for (const x of row) if (x.mine) x.revealed = true; return; }
    const stack = [[r, c]];
    while (stack.length) {
      const [rr, cc] = stack.pop();
      const cur = this.grid[rr][cc];
      if (!cur || cur.revealed || cur.flagged || cur.mine) continue;
      cur.revealed = true;
      if (cur.adj === 0) {
        for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
          const nr = rr + dr, nc = cc + dc;
          if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) stack.push([nr, nc]);
        }
      }
    }
    if (this.won()) { this.status = 'win'; for (const row of this.grid) for (const x of row) if (x.mine) x.flagged = true; }
  }
  flag(r, c) {
    const d = this.grid[r][c];
    if (!d || d.revealed || this.status !== 'play') return;
    d.flagged = !d.flagged;
  }
  won() {
    for (const row of this.grid) for (const d of row) if (!d.mine && !d.revealed) return false;
    return true;
  }
  handleMouse(e, isFlag) {
    const p = canvasPos(this.canvas, e);
    if (p.y < this.topH) { this.reset(); this.draw(); return; }
    const c = Math.floor(p.x / this.cell);
    const r = Math.floor((p.y - this.topH) / this.cell);
    if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return;
    if (isFlag) this.flag(r, c); else this.reveal(r, c);
    this.draw();
  }
  draw() {
    const ctx = this.ctx, cell = this.cell, topH = this.topH;
    ctx.fillStyle = '#1a1a22';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '18px "Microsoft YaHei"';
    ctx.fillStyle = '#ffd400';
    ctx.fillText('💣' + (this.mines - this.flagCount()), 24, topH / 2);
    ctx.font = '22px sans-serif';
    const face = this.status === 'win' ? '😎' : this.status === 'lose' ? '😵' : '🙂';
    ctx.fillText(face, this.canvas.width / 2, topH / 2);
    ctx.font = 'bold 20px "Microsoft YaHei"';
    for (let r = 0; r < this.rows; r++) for (let c = 0; c < this.cols; c++) {
      const x = c * cell, y = topH + r * cell;
      const d = this.grid[r][c];
      if (d.revealed) {
        ctx.fillStyle = '#3a3a48';
        ctx.fillRect(x, y, cell - 1, cell - 1);
        if (d.mine) { ctx.fillText('💣', x + cell / 2, y + cell / 2); }
        else if (d.adj > 0) {
          ctx.fillStyle = ['#66d9ff', '#33cc55', '#e02020', '#a040e0', '#ff8c00', '#00d9f0', '#ffd400', '#ccc'][d.adj - 1];
          ctx.fillText(String(d.adj), x + cell / 2, y + cell / 2);
        }
      } else {
        ctx.fillStyle = '#4a4a5a';
        ctx.fillRect(x, y, cell - 1, cell - 1);
        if (d.flagged) ctx.fillText('🚩', x + cell / 2, y + cell / 2);
      }
    }
  }
}

function canvasPos(canvas, e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

const tetris = new Tetris($('tetris-canvas'));
const mines = new Minesweeper($('mines-canvas'));
const videoEl = $('video-el');

// ============================================================
//  全局状态
// ============================================================
let mode = 'start';                    // start | instructions | practice | task | rating | end
let activeSide = 'math';               // 'math' | 'distraction'
let distMode = 'tetris';               // 'tetris' | 'video:0' ...
let currentVideoSrc = null;
let curProblem = null;
let typed = '';
let blockIndex = 0;
let nAttempted = 0, nCorrect = 0;
let timeMath = 0, timeTetris = 0, timeVideo = 0, timeMines = 0;
let participant = '', session = '';
let startedAt = null;   // 实验开始时间(点「开始实验」时记录)
let problemsData = [], blocksData = [], switchesData = [], ratingsData = [];
let blockStartTs = 0;
let continueCb = null;

// ============================================================
//  说明文字
// ============================================================
const INSTRUCTIONS =
  "欢迎参加本实验!\n\n" +
  "接下来是一个关于「学习」的活动。屏幕会分成两个区域:\n\n" +
  "  左侧 —— 数学练习:这些题目能帮助你锻炼和提高解题能力,对学业很有帮助。\n\n" +
  "  右侧 —— 游戏或视频:点击右侧顶部的下拉菜单,可选择玩俄罗斯方块、扫雷或看视频。\n\n" +
  "你可以自己决定如何分配时间:做数学、玩游戏或看视频都可以,\n" +
  "随时用鼠标点击对应区域(或按 Tab 键)进行切换。\n\n" +
  "顶部会显示当前阶段和剩余时间。";

function fmtDur(sec) {
  return sec >= 60 ? (sec / 60) + ' 分钟' : sec + ' 秒';
}

const MAIN_INSTRUCTIONS =
  "练习结束!\n\n" +
  "现在进入正式实验,共 " + CONFIG.nBlocks + " 个阶段,每个阶段 " + fmtDur(CONFIG.blockSeconds) + "。\n\n" +
  "你可以自由切换:\n" +
  "  点击左侧 → 做数学\n" +
  "  点击右侧顶部下拉菜单 → 选择俄罗斯方块、扫雷或某个视频\n" +
  "  或按 Tab 键快速切换\n\n" +
  "每个阶段时间到后会自动进入下一阶段。";

// ============================================================
//  界面切换
// ============================================================
function showInstructions(title, body, onContinue) {
  mode = 'instructions';
  showScreen('screen-instructions');
  $('instr-title').textContent = title;
  $('instr-body').textContent = body;
  continueCb = onContinue;
}
function continueInstructions() {
  const cb = continueCb; continueCb = null;
  if (cb) cb();
}

function populateSelect() {
  const sel = $('dist-select');
  sel.innerHTML = '<option value="tetris">俄罗斯方块</option>' +
                  '<option value="minesweeper">扫雷</option>';
  CONFIG.videos.forEach((src, i) => {
    const opt = document.createElement('option');
    opt.value = 'video:' + i;
    opt.textContent = basename(src);
    sel.appendChild(opt);
  });
}

function updateActiveHighlight() {
  $('left-panel').classList.toggle('active', activeSide === 'math');
  $('right-panel').classList.toggle('active', activeSide === 'distraction');
  const note = $('paused-note');
  note.textContent = (distMode === 'tetris') ? '已暂停 · 点击右侧继续游戏' : '已暂停 · 点击右侧继续';
  note.classList.toggle('hidden', activeSide === 'distraction');
}

function updateDistractionView() {
  const isVideo = distMode.startsWith('video:');
  $('tetris-canvas').style.display = (distMode === 'tetris') ? 'block' : 'none';
  $('mines-canvas').style.display = (distMode === 'minesweeper') ? 'block' : 'none';
  $('video-el').style.display = isVideo ? 'block' : 'none';
  $('video-placeholder').style.display = 'none';
}

function playVideo(src) {
  if (currentVideoSrc !== src) {
    currentVideoSrc = src;
    videoEl.src = src;
    videoEl.load();
  }
  videoEl.play().then(() => {
    $('video-placeholder').style.display = 'none';
  }).catch(() => {
    $('video-placeholder').style.display = 'block';
  });
}
videoEl.addEventListener('error', () => {
  if (distMode.startsWith('video:')) $('video-placeholder').style.display = 'block';
});

function changeState(side, dm) {
  const from = (activeSide === 'math') ? 'math' : distMode;
  const to = (side === 'math') ? 'math' : dm;
  if (from !== to && blockStartTs) {
    switchesData.push({
      block: blockIndex,
      t: round3((performance.now() - blockStartTs) / 1000),
      from: from, to: to,
    });
  }
  activeSide = side;
  distMode = dm;
  updateActiveHighlight();
  updateDistractionView();
  if (dm.startsWith('video:')) {
    if (side === 'distraction') playVideo(CONFIG.videos[parseInt(dm.slice(6))]);
    else videoEl.pause();
  } else {
    videoEl.pause();
  }
}

// ============================================================
//  数学输入
// ============================================================
function renderMath() {
  const pEl = (mode === 'practice') ? $('practice-problem') : $('task-problem');
  const tEl = (mode === 'practice') ? $('practice-typed') : $('task-typed');
  pEl.textContent = curProblem.text;
  tEl.textContent = typed || '_';
}

function handleMathKey(e) {
  if (e.key >= '0' && e.key <= '9' && typed.length < 3) { typed += e.key; renderMath(); }
  else if (e.key === 'Backspace') { typed = typed.slice(0, -1); renderMath(); }
  else if (e.key === '-' && CONFIG.allowNegative && typed === '') { typed = '-'; renderMath(); }
  else if (e.key === 'Enter') submitMath();
}

function submitMath() {
  const ans = parseInt(typed, 10);
  const correct = (!isNaN(ans) && ans === curProblem.ans) ? 1 : 0;
  if (mode === 'task') {
    nAttempted++; nCorrect += correct;
    problemsData.push({ block: blockIndex, problem: curProblem.problem, response: typed, correct: correct });
  }
  typed = '';
  curProblem = generateProblem();
  renderMath();
}

// ============================================================
//  键盘 / 鼠标
// ============================================================
document.addEventListener('keydown', (e) => {
  if (mode === 'instructions') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); continueInstructions(); }
    return;
  }
  if (mode === 'rating') {
    if (e.key >= '1' && e.key <= '4') submitRating(parseInt(e.key, 10));
    return;
  }
  if (mode === 'practice') { handleMathKey(e); return; }
  if (mode === 'task') {
    if (e.key === 'Tab') { e.preventDefault(); toggleActive(); return; }
    if (activeSide === 'math') handleMathKey(e);
    else if (distMode === 'tetris') handleTetrisKey(e);
    return;
  }
});

function handleTetrisKey(e) {
  if (e.key === 'ArrowLeft') { e.preventDefault(); tetris.move(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); tetris.move(1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); tetris.softDrop(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); tetris.rotate(); }
  else if (e.key === ' ') { e.preventDefault(); tetris.hardDrop(); }
}

function toggleActive() {
  changeState((activeSide === 'math') ? 'distraction' : 'math', distMode);
}

$('left-panel').addEventListener('click', () => changeState('math', distMode));
$('right-panel').addEventListener('click', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;
  changeState('distraction', distMode);
});
$('dist-select').addEventListener('change', (e) => {
  changeState('distraction', e.target.value);
});

// 扫雷 的鼠标交互(左键/右键;仅任务中有效)
$('mines-canvas').addEventListener('mousedown', (e) => {
  if (mode !== 'task') return;
  if (activeSide !== 'distraction' || distMode !== 'minesweeper') changeState('distraction', 'minesweeper');
  if (e.button === 0) mines.handleMouse(e, false);
});
$('mines-canvas').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (mode !== 'task') return;
  if (activeSide !== 'distraction' || distMode !== 'minesweeper') changeState('distraction', 'minesweeper');
  mines.handleMouse(e, true);
});
// ============================================================
//  流程
// ============================================================
$('btn-start').addEventListener('click', () => {
  participant = $('participant').value.trim() || '未命名';
  session = $('session').value.trim() || '001';
  startedAt = new Date();
  showInstructions('实验说明', INSTRUCTIONS, startPractice);
});
$('btn-continue').addEventListener('click', continueInstructions);

function startPractice() {
  mode = 'practice';
  showScreen('screen-practice');
  curProblem = generateProblem(); typed = '';
  renderMath();
  const start = performance.now();
  const durMs = CONFIG.practiceSeconds * 1000;
  function frame(ts) {
    const remain = (durMs - (ts - start)) / 1000;
    $('practice-timer').textContent = '剩余 ' + Math.ceil(remain) + ' 秒';
    if (remain <= 0) { showInstructions('正式开始', MAIN_INSTRUCTIONS, startBlocks); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function startBlocks() {
  mode = 'task';
  showScreen('screen-task');
  populateSelect();
  activeSide = 'math'; distMode = 'tetris';
  $('dist-select').value = 'tetris';
  currentVideoSrc = null;
  videoEl.pause(); videoEl.removeAttribute('src'); videoEl.load();
  updateActiveHighlight(); updateDistractionView();
  blockIndex = 0;
  runNextBlock();
}

function runNextBlock() {
  if (blockIndex >= CONFIG.nBlocks) { endExperiment(); return; }
  mode = 'task';
  showScreen('screen-task');
  blockIndex++;
  nAttempted = 0; nCorrect = 0;
  timeMath = 0; timeTetris = 0; timeVideo = 0; timeMines = 0;
  tetris.reset(); mines.reset();
  activeSide = 'math';
  videoEl.pause();
  updateActiveHighlight();
  curProblem = generateProblem(); typed = ''; renderMath();

  const start = performance.now();
  blockStartTs = start;
  const durMs = CONFIG.blockSeconds * 1000;
  let lastTs = start;
  function frame(ts) {
    let dt = (ts - lastTs) / 1000; lastTs = ts;
    if (dt < 0) dt = 0; else if (dt > 0.5) dt = 0.5;  // 防后台/掉帧导致时间虚高

    if (activeSide === 'math') timeMath += dt;
    else if (distMode === 'tetris') timeTetris += dt;
    else if (distMode === 'minesweeper') timeMines += dt;
    else timeVideo += dt;

    if (distMode === 'tetris') {
      if (activeSide === 'distraction') tetris.update(dt);
      tetris.draw();
    } else if (distMode === 'minesweeper') {
      mines.draw();
    }

    const remain = (durMs - (ts - start)) / 1000;
    $('task-timer').textContent = '第 ' + blockIndex + '/' + CONFIG.nBlocks + ' 块   剩余 ' + Math.ceil(remain) + ' 秒';
    if (remain <= 0) {
      videoEl.pause();
      blocksData.push({
        block: blockIndex,
        time_math: round3(timeMath), time_tetris: round3(timeTetris), time_video: round3(timeVideo),
        time_minesweeper: round3(timeMines),
        n_attempted: nAttempted, n_correct: nCorrect,
        accuracy: nAttempted ? round3(nCorrect / nAttempted) : null,
      });
      askBoredom();
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ============================================================
//  数据:提交 + 下载
// ============================================================
function buildCSV() {
  const out = [];
  const row = (arr) => out.push(arr.map(csvCell).join(','));

  // 表1:块级汇总(主要分析用)——每块时间分配、答题数、正确率、无聊程度
  const totalMath = blocksData.reduce((s, b) => s + b.time_math, 0);
  const totalTetris = blocksData.reduce((s, b) => s + b.time_tetris, 0);
  const totalVideo = blocksData.reduce((s, b) => s + b.time_video, 0);
  const totalMines = blocksData.reduce((s, b) => s + b.time_minesweeper, 0);
  const totalAttempted = blocksData.reduce((s, b) => s + b.n_attempted, 0);
  const totalCorrect = blocksData.reduce((s, b) => s + b.n_correct, 0);

  row(['participant', 'session', 'block', 'time_math_sec', 'time_tetris_sec', 'time_video_sec', 'time_minesweeper_sec', 'time_total_sec', 'n_attempted', 'n_correct', 'accuracy', 'boredom']);
  for (const b of blocksData) {
    const r = ratingsData.find(x => x.block === b.block);
    row([participant, session, b.block,
         b.time_math, b.time_tetris, b.time_video, b.time_minesweeper,
         round3(b.time_math + b.time_tetris + b.time_video + b.time_minesweeper),
         b.n_attempted, b.n_correct,
         b.n_attempted ? round3(b.n_correct / b.n_attempted) : '',
         r ? r.boredom : '']);
  }
  row([participant, session, 'total',
       round3(totalMath), round3(totalTetris), round3(totalVideo), round3(totalMines),
       round3(totalMath + totalTetris + totalVideo + totalMines),
       totalAttempted, totalCorrect,
       totalAttempted ? round3(totalCorrect / totalAttempted) : '', '']);

  // 表2:逐题明细
  out.push('');
  row(['participant', 'session', 'block', 'problem', 'response', 'correct']);
  for (const p of problemsData) row([participant, session, p.block, p.problem, p.response, p.correct]);

  // 表3:切换记录
  out.push('');
  row(['participant', 'session', 'block', 't_sec', 'from', 'to']);
  for (const s of switchesData) row([participant, session, s.block, s.t, s.from, s.to]);

  return out.join('\n');
}
function csvCell(v) {
  v = String(v == null ? '' : v);
  if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
  return v;
}

function downloadCSV() {
  const blob = new Blob(['﻿' + buildCSV()], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ADT_' + participant + '_' + session + '_' + Date.now() + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function highlightDownload() {
  const btn = $('btn-download');
  if (!btn) return;
  btn.classList.add('danger');
  btn.textContent = '下载数据(CSV) — 请回传给主试';
}

// 用原生表单提交(隐藏 iframe)发送数据:
// 1) 这是 Apps Script doPost 的标准用法,POST 一定送达 doPost;
// 2) 不经过 XHR/fetch,多数广告拦截插件拦不到;
// 3) 无跨域限制,也不受 302 跳转影响。
function submitViaIframe(url, fields) {
  return new Promise((resolve) => {
    const iframe = document.createElement('iframe');
    iframe.name = 'adt-frame-' + Date.now();
    iframe.setAttribute('style', 'display:none;width:0;height:0;border:0;');
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframe.name;
    form.style.display = 'none';
    for (const k in fields) {
      const inp = document.createElement('input');
      inp.type = 'hidden';
      inp.name = k;
      inp.value = fields[k];
      form.appendChild(inp);
    }
    document.body.appendChild(form);

    let settled = false;
    const finish = (ok) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      setTimeout(() => { form.remove(); iframe.remove(); }, 1500);
      resolve(ok);
    };
    iframe.addEventListener('load', () => finish(true));
    iframe.addEventListener('error', () => finish(false));
    const timer = setTimeout(() => finish(false), 10000);

    form.submit();
  });
}

async function submitData() {
  const now = new Date();
  const payload = {
    meta: {
      participant, session,
      startedAt: startedAt ? startedAt.toISOString() : null,
      submittedAt: now.toISOString(),
      startedAtLocal: startedAt ? fmtLocal(startedAt) : null,
      submittedAtLocal: fmtLocal(now),
      ua: navigator.userAgent,
      screen: [window.screen.width, window.screen.height],
    },
    blocks: blocksData,
    problems: problemsData,
    switches: switchesData,
    ratings: ratingsData,
  };
  const statusEl = $('submit-status');
  if (!CONFIG.submitUrl) {
    statusEl.textContent = '未配置提交地址(请填 CONFIG.submitUrl),请点击下方按钮下载数据。';
    return;
  }
  statusEl.textContent = '正在提交数据...';
  try {
    if (CONFIG.submitFormat === 'form') {
      // 表单方式:适配 Google Apps Script / Google Forms。
      // 用原生表单提交(隐藏 iframe),而非 fetch:
      // 1) 这是 Apps Script doPost 的标准用法,POST 一定送达 doPost;
      // 2) 不经过 XHR/fetch,多数广告拦截插件拦不到;
      // 3) 无跨域限制,也不受 302 跳转影响。
      const fields = {
        participant: participant,
        session: session,
        data: JSON.stringify(payload),
      };
      let ok = await submitViaIframe(CONFIG.submitUrl, fields);
      // iframe 提交失败(网络不通/超时)时,再用 sendBeacon 兜底一次
      if (!ok && navigator.sendBeacon) {
        try {
          const params = new URLSearchParams(fields);
          const blob = new Blob([params.toString()], { type: 'application/x-www-form-urlencoded' });
          ok = navigator.sendBeacon(CONFIG.submitUrl, blob);
        } catch (e) {}
      }
      if (ok) {
        statusEl.textContent = '数据已提交(建议同时下载 CSV 备份以防万一)';
      } else {
        statusEl.textContent = '自动提交失败,请点击下方按钮下载 CSV 回传给主试。';
        highlightDownload();
      }
      return;
    }
    const resp = await fetch(CONFIG.submitUrl, {
      method: CONFIG.submitMethod || 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (resp.ok) {
      statusEl.textContent = '数据已成功提交 ✓';
    } else {
      statusEl.textContent = '提交失败(HTTP ' + resp.status + '),请下载 CSV 手动回传。';
      highlightDownload();
    }
  } catch (err) {
    statusEl.textContent = '提交出错:' + err.message + ',请下载 CSV 手动回传。';
    highlightDownload();
  }
}

$('btn-download').addEventListener('click', downloadCSV);

// ============================================================
//  块后评定(无聊程度)
// ============================================================
function askBoredom() {
  mode = 'rating';
  showScreen('screen-rating');
  $('rating-block-title').textContent = '第 ' + blockIndex + ' 块已结束';
}
function submitRating(v) {
  if (mode !== 'rating') return;   // 防止重复/误触导致块被跳过
  ratingsData.push({ block: blockIndex, boredom: v });
  if (blockIndex < CONFIG.nBlocks) runNextBlock();
  else endExperiment();
}
document.querySelectorAll('.rating-btn').forEach(btn => {
  btn.addEventListener('click', () => submitRating(parseInt(btn.dataset.v, 10)));
});

// ============================================================
//  结束
// ============================================================
function endExperiment() {
  mode = 'end';
  showScreen('screen-end');
  submitData();
}
</script>
